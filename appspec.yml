version: 0.0
os: linux
files:
  - source: /
    destination: /opt/app
hooks:
  BeforeInstall:
    - location: scripts/stop_app.sh
      timeout: 60
  AfterInstall:
    - location: scripts/install_deps.sh
      timeout: 180
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 60
  ValidateService:
    - location: scripts/health_check.sh
      timeout: 60
