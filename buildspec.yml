version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Cài dependencies Node.js (express, dotenv, express-handlebars, body-parser, mysql)"
      - npm install
  build:
    commands:
      - echo "Build hoàn tất"
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**/*
    - .git/**/*
